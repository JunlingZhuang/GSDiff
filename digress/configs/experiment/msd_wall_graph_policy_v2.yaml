# @package _global_
general:
    name: 'msd_wall_graph_policy_v2'
    gpus: 1
    strategy: 'auto'
    matmul_precision: 'high'
    wandb: 'disabled'
    check_val_every_n_epochs: 10
    sample_every_val: 2
    samples_to_generate: 16
    samples_to_save: 8
    chains_to_save: 0
    final_model_samples_to_generate: 128
    final_model_samples_to_save: 32
    final_model_chains_to_save: 0
train:
    n_epochs: 200
    batch_size: 8
    lr: 0.0001
    weight_decay: 1e-12
    clip_grad: null
    ema_decay: 0
    num_workers: 0
    num_sanity_val_steps: 0
    save_model: True
model:
    transition: 'absorbing'
    diffusion_steps: 500
    maskgit_steps: 16
    n_layers: 5
    # Graph Policy V2 trains one policy step: current partial graph + one
    # masked target node -> target room type and target-to-current edge types.
    # Full completion is obtained by repeatedly applying this policy.
    lambda_train: [2.0, 0]
    edge_loss_mode: 'split_presence_type'
    edge_presence_loss_weight: 1.0
    edge_type_loss_weight: 1.0
    edge_density_loss_weight: 0.5
    # Kept for backward compatibility; ignored when edge_loss_mode is split.
    edge_present_loss_weight: 1.0
    extra_features: 'all'
    edge_none_logit_bias: 0.4
    graph_condition:
        enabled: true
        room_type_inventory: true
    absorbing_masking:
        strategy: 'mixed'
        eval_strategy: 'graph_policy'
        random_probability: 0.02
        full_completion_probability: 0.00
        next_node_probability: 0.08
        graph_policy_probability: 0.90
        # Dynamic partial-graph sizes. This teaches the policy to operate from
        # sparse early states through almost-complete late states.
        known_ratio_start: 0.85
        known_ratio_end: 0.30
        eval_known_ratio: 0.50
        curriculum_epochs: 140
        known_ratio_jitter: 0.20
    hidden_mlp_dims: {'X': 128, 'E': 64, 'y': 128}
    hidden_dims: {'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256}
test:
    checkpoint: null
    out_dir: null
    num_samples: 32
    batch_size: 8
    num_nodes: null
    grid_samples: 24
    grid_cols: 4
    device: 'auto'
completion:
    checkpoint: null
    out_dir: null
    num_samples: 32
    batch_size: 1
    known_ratio: 0.5
    grid_samples: 12
    seed: 0
    device: 'auto'
next_node:
    checkpoint: null
    out_dir: null
    num_samples: 32
    batch_size: 1
    grid_samples: 12
    seed: 0
    device: 'auto'
autoregressive:
    checkpoint: null
    out_dir: null
    num_samples: 32
    batch_size: 1
    known_ratio: 0.5
    grid_samples: 12
    seed: 0
    device: 'auto'
