# @package _global_
general:
    name: 'msd_wall_graph_policy_v2_stable'
    gpus: 1
    strategy: 'auto'
    matmul_precision: 'high'
    wandb: 'disabled'
    check_val_every_n_epochs: 5
    sample_every_val: 4
    samples_to_generate: 16
    samples_to_save: 8
    chains_to_save: 0
    final_model_samples_to_generate: 128
    final_model_samples_to_save: 32
    final_model_chains_to_save: 0
train:
    n_epochs: 200
    batch_size: 8
    lr: 0.00005
    weight_decay: 1e-12
    clip_grad: null
    ema_decay: 0
    num_workers: 0
    num_sanity_val_steps: 0
    save_model: True
model:
    transition: 'absorbing'
    diffusion_steps: 500
    maskgit_steps: 16
    n_layers: 5
    # More conservative than msd_wall_graph_policy_v2: the first run improved
    # until about epoch 40, then edge validation loss rose as the curriculum
    # made partial graphs too sparse. This config keeps the policy closer to
    # the app case: add one room to a reasonably developed graph.
    lambda_train: [2.0, 0]
    edge_loss_mode: 'split_presence_type'
    edge_presence_loss_weight: 1.0
    edge_type_loss_weight: 1.0
    edge_density_loss_weight: 0.2
    edge_present_loss_weight: 1.0
    extra_features: 'all'
    # Calibrated on 2026-05-19: -0.2 matched next-node target degree
    # (3.95 vs 3.95 reference) and gave the best connection F1 in the sweep.
    edge_none_logit_bias: -0.2
    graph_condition:
        enabled: true
        room_type_inventory: true
    absorbing_masking:
        strategy: 'mixed'
        eval_strategy: 'graph_policy'
        random_probability: 0.05
        full_completion_probability: 0.00
        next_node_probability: 0.10
        graph_policy_probability: 0.85
        known_ratio_start: 0.85
        known_ratio_end: 0.50
        eval_known_ratio: 0.50
        curriculum_epochs: 80
        known_ratio_jitter: 0.10
    hidden_mlp_dims: {'X': 128, 'E': 64, 'y': 128}
    hidden_dims: {'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256}
test:
    checkpoint: null
    out_dir: null
    num_samples: 32
    batch_size: 8
    num_nodes: null
    grid_samples: 24
    grid_cols: 4
    device: 'auto'
completion:
    checkpoint: null
    out_dir: null
    num_samples: 32
    batch_size: 1
    known_ratio: 0.5
    grid_samples: 12
    seed: 0
    device: 'auto'
next_node:
    checkpoint: null
    out_dir: null
    num_samples: 32
    batch_size: 1
    grid_samples: 12
    seed: 0
    device: 'auto'
autoregressive:
    checkpoint: null
    out_dir: null
    num_samples: 32
    batch_size: 1
    known_ratio: 0.5
    grid_samples: 12
    seed: 0
    device: 'auto'
