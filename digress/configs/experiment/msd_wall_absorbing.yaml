# @package _global_
general:
    name: 'msd_wall_absorbing'
    gpus: 1
    strategy: 'auto'
    matmul_precision: 'high'
    wandb: 'disabled'
    check_val_every_n_epochs: 10
    sample_every_val: 2
    samples_to_generate: 16
    samples_to_save: 8
    chains_to_save: 0
    final_model_samples_to_generate: 128
    final_model_samples_to_save: 32
    final_model_chains_to_save: 0
train:
    n_epochs: 200
    batch_size: 8
    lr: 0.0001
    weight_decay: 1e-12
    clip_grad: null
    ema_decay: 0
    num_workers: 0
    num_sanity_val_steps: 0
    save_model: True
model:
    # Separate path from vanilla DiGress. `marginal` configs still train the
    # original model; `absorbing` adds an internal [MASK] class and trains only
    # on masked node/edge positions.
    transition: 'absorbing'
    diffusion_steps: 500
    maskgit_steps: 16
    n_layers: 5
    lambda_train: [2, 0]
    # Keep the first absorbing version simple. DiGress structural features treat
    # every non-zero edge class as observed; with a [MASK] edge class that would
    # leak "unknown" edges into cycle/spectral features. We can add a mask-aware
    # feature extractor after the core objective is validated.
    extra_features: null
    hidden_mlp_dims: {'X': 128, 'E': 64, 'y': 128}
    hidden_dims: {'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256}
test:
    checkpoint: null
    out_dir: null
    num_samples: 32
    batch_size: 8
    num_nodes: null
    grid_samples: 24
    grid_cols: 4
    device: 'auto'
