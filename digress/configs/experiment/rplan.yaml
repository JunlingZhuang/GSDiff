# @package _global_
general:
    name: 'rplan'
    gpus: 1
    strategy: 'auto'
    matmul_precision: 'high'
    wandb: 'disabled'
    check_val_every_n_epochs: 20
    sample_every_val: 2
    samples_to_generate: 32
    samples_to_save: 16
    chains_to_save: 1
    final_model_samples_to_generate: 256
    final_model_samples_to_save: 32
    final_model_chains_to_save: 4
train:
    n_epochs: 200
    batch_size: 128
    lr: 0.0002
    weight_decay: 1e-12
    clip_grad: null
    ema_decay: 0
    num_workers: 0
    num_sanity_val_steps: 0
    save_model: True
model:
    transition: 'marginal'
    diffusion_steps: 500
    n_layers: 5
    lambda_train: [5, 0]
    extra_features: 'all'
    hidden_mlp_dims: {'X': 128, 'E': 64, 'y': 128}
    hidden_dims: {'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256}
test:
    checkpoint: 'outputs/2026-04-23/21-11-23-rplan/checkpoints/rplan/best-v2.ckpt'
    out_dir: null
    num_samples: 64
    batch_size: 64
    num_nodes: null
    grid_samples: 32
    grid_cols: 4
    device: 'auto'
