---
# =============================================================================
# GRAN v2 DEBUG config — small-epoch smoke test on the grid dataset.
#
# Purpose: verify the training pipeline end-to-end (data loading -> forward ->
# loss -> backward -> checkpoint -> test) runs without errors in < 5 minutes.
# NOT intended for producing a usable model.
#
# Run:
#   cd GRAN
#   D:/Github/GSDiff/.venv/Scripts/python.exe run_exp.py -c config/gran_v2_grid_debug.yaml
#
# Then inspect output under exp/GRANv2_debug/<run_id>/.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. DEBUG-FRIENDLY TRAINING KNOBS
# -----------------------------------------------------------------------------
train:
  max_epoch: 2                  # just 2 epochs — we only want to prove the loop runs
  batch_size: 1
  num_workers: 0

  optimizer: Adam
  lr: 1.0e-4
  wd: 0.0
  momentum: 0.9
  lr_decay: 0.3
  lr_decay_epoch: [100000000]

  lambda_attr: 1.0

  display_iter: 1               # print loss every iteration so we see activity fast
  snapshot_epoch: 1             # save a checkpoint after epoch 1 to confirm saving works
  valid_epoch: 1
  shuffle: true
  is_resume: false
  resume_dir:
  resume_model: model_snapshot_0000002.pth
  resume_epoch: 2

# -----------------------------------------------------------------------------
# 2. SMALLER MODEL (faster debug pass)
# -----------------------------------------------------------------------------
model:
  name: GRANv2

  use_gatv2: true
  gatv2_num_heads: 2            # fewer heads for speed

  num_attr_classes: 5

  hidden_dim: 64                # half of the main grid config
  embedding_dim: 64
  num_GNN_layers: 3             # fewer layers
  num_GNN_prop: 1

  max_num_nodes: 361
  num_mix_component: 5          # fewer mixture components
  is_sym: true
  block_size: 1
  sample_stride: 1
  num_canonical_order: 1
  dimension_reduce: true
  has_attention: true
  edge_weight: 1.0

# -----------------------------------------------------------------------------
# 3. DATASET — reuse grid
# -----------------------------------------------------------------------------
dataset:
  loader_name: GRANDataV2
  name: grid
  data_path: data/
  node_order: DFS
  train_ratio: 0.8
  dev_ratio: 0.2
  num_subgraph_batch: 10        # only 10 subgraphs per sample for speed
  num_fwd_pass: 1
  has_node_feat: false
  is_save_split: false
  is_sample_subgraph: true
  is_overwrite_precompute: true # overwrite to avoid stale cached precompute

# -----------------------------------------------------------------------------
# 4. TEST — generate just a few samples
# -----------------------------------------------------------------------------
test:
  batch_size: 2
  num_workers: 0
  num_test_gen: 4
  is_vis: true
  is_single_plot: false
  is_test_ER: false
  num_vis: 4
  vis_num_row: 2
  better_vis: true
  test_model_dir: snapshot_model
  test_model_name: gran_v2_grid.pth   # only meaningful in -t mode; unused in train

# -----------------------------------------------------------------------------
# 5. RUNTIME
# -----------------------------------------------------------------------------
exp_name: GRANv2_debug
exp_dir: exp/GRANv2_debug
runner: GranRunnerV2
use_horovod: false
use_gpu: true                   # set to false if no CUDA
device: cuda:0
gpus: [0]
seed: 1234
