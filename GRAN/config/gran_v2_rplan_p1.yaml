---
# =============================================================================
# GRAN v2 + Path 1 (ordering-id conditioning) for RPLAN.
#
# Isolates the "ordering-id embedding" variable from the degree-rank feature
# so we can measure the effect of each ablation independently.
#
#   * num_canonical_order = 3   (DFS + BFS + k-core, same as struct)
#   * use_ordering_id     = true  [NEW: Path 1]
#   * use_degree_feature  = false [kept off so the ablation is clean]
#
# Why this config exists:
#   The struct config (gran_v2_rplan_struct.yaml) turned on multi-ordering
#   AND degree-rank embedding at once, and TEST/degree MMD came out 77x
#   worse than the single-ordering baseline. Root cause: without an
#   ordering-id signal, multi-ordering teaches the model a useless
#   "mixture of orderings" distribution that no single sampling pass
#   matches. This config fixes only that single issue, so we can confirm
#   the fix on its own before combining it with degree-rank again.
#
# Train / test:
#   uv run python run_exp.py -c config/gran_v2_rplan_p1.yaml
#   uv run python run_exp.py -c config/gran_v2_rplan_p1.yaml -t
# =============================================================================

# -----------------------------------------------------------------------------
# 1. MOST-COMMONLY TUNED TRAINING KNOBS
# -----------------------------------------------------------------------------
train:
  max_epoch: 50                 # ablation-speed: ~3x orderings learn quickly
  batch_size: 64
  num_workers: 0

  optimizer: Adam
  lr: 2.0e-4
  wd: 1.0e-5
  momentum: 0.9
  lr_decay: 0.3
  lr_decay_epoch: [15, 35]      # adjusted for the shorter 50-epoch schedule

  lambda_attr: 0.5

  display_iter: 50
  snapshot_epoch: 10
  valid_epoch: 5
  shuffle: true
  is_resume: false
  resume_dir:
  resume_model: model_snapshot_0000050.pth
  resume_epoch: 50

# -----------------------------------------------------------------------------
# 2. MODEL ARCHITECTURE (+ Path-1 ordering-id feature)
# -----------------------------------------------------------------------------
model:
  name: GRANv2

  # Backbone switch
  use_gatv2: true
  gatv2_num_heads: 8

  num_attr_classes: 7

  hidden_dim: 256
  embedding_dim: 256
  num_GNN_layers: 6
  num_GNN_prop: 1

  max_num_nodes: 16
  num_mix_component: 30
  is_sym: true
  block_size: 1
  sample_stride: 1

  # ---- [Path 1] structural improvements (ISOLATED) ---------------------
  # Same 3 canonical orderings as struct so the ablation is paired.
  num_canonical_order: 3

  # NEW: add an ordering-id embedding to every node before GNN propagation
  # so the model knows which of its C canonical orderings it is seeing.
  # At sampling time we pin ordering id 0 (the first ordering = DFS).
  use_ordering_id: true

  # Kept OFF for Path 1 so any metric change is attributable to ordering-id.
  use_degree_feature: false
  # ----------------------------------------------------------------------

  dimension_reduce: true
  has_attention: true
  edge_weight: 1.0

# -----------------------------------------------------------------------------
# 3. DATASET
# -----------------------------------------------------------------------------
dataset:
  loader_name: GRANDataV2
  name: RPLAN
  data_path: data/

  # DFS+BFS+k-core pairs with model.num_canonical_order=3.
  node_order: 'DFS+BFS+k_core'

  total_graphs: 20000

  train_ratio: 0.9
  dev_ratio: 0.05
  num_subgraph_batch: 8
  num_fwd_pass: 1
  has_node_feat: false
  is_save_split: false
  is_sample_subgraph: true
  is_overwrite_precompute: true

# -----------------------------------------------------------------------------
# 4. TEST / INFERENCE
# -----------------------------------------------------------------------------
test:
  batch_size: 100
  num_workers: 0
  num_test_gen: 1000
  is_vis: true
  is_single_plot: false
  is_test_ER: false
  num_vis: 20
  vis_num_row: 5
  better_vis: true
  test_model_dir: exp/GRANv2_rplan_p1/GRANv2_RPLAN_2026-Apr-21-18-17-38_41540
  test_model_name: model_best.pth

# -----------------------------------------------------------------------------
# 5. RUNTIME
# -----------------------------------------------------------------------------
exp_name: GRANv2_rplan_p1
exp_dir: exp/GRANv2_rplan_p1      # separate dir to keep the ablation isolated
runner: GranRunnerV2
use_horovod: false
use_gpu: true
device: cuda:0
gpus: [0]
seed: 1234
