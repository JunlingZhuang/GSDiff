---
# =============================================================================
# GRAN v2 training config for FIRSTMM_DB (large molecular graphs, ~1300 nodes)
#
# Run with:
#   uv run python run_exp.py -c config/gran_v2_DB.yaml        # train
#   uv run python run_exp.py -c config/gran_v2_DB.yaml -t     # test
# =============================================================================

# -----------------------------------------------------------------------------
# 1. MOST-COMMONLY TUNED TRAINING KNOBS
# -----------------------------------------------------------------------------
train:
  max_epoch: 20000              # DB needs many more epochs (small dataset, big graphs)
  batch_size: 1                 # graphs are huge; batch_size=1 is necessary
  num_workers: 0

  optimizer: Adam
  lr: 1.0e-4
  wd: 0.0
  momentum: 0.9
  lr_decay: 0.1
  lr_decay_epoch: [100000000]

  lambda_attr: 1.0

  display_iter: 10
  snapshot_epoch: 100
  valid_epoch: 50
  shuffle: true
  is_resume: false
  resume_dir:
  resume_model: model_snapshot_0005000.pth
  resume_epoch: 5000

# -----------------------------------------------------------------------------
# 2. MODEL ARCHITECTURE
# -----------------------------------------------------------------------------
model:
  name: GRANv2

  use_gatv2: true
  gatv2_num_heads: 4

  num_attr_classes: 7           # DB has richer node types than grid

  hidden_dim: 256               # larger capacity for larger graphs
  embedding_dim: 256
  num_GNN_layers: 7
  num_GNN_prop: 1

  max_num_nodes: 3530           # DB graph cap
  num_mix_component: 20
  is_sym: true
  block_size: 1
  sample_stride: 1
  num_canonical_order: 1
  dimension_reduce: true
  has_attention: true
  edge_weight: 1.0

# -----------------------------------------------------------------------------
# 3. DATASET
# -----------------------------------------------------------------------------
dataset:
  loader_name: GRANDataV2
  name: FIRSTMM_DB
  data_path: data/
  node_order: DFS
  train_ratio: 0.8
  dev_ratio: 0.2
  num_subgraph_batch: 1         # subgraphs are already huge; 1 per sample
  num_fwd_pass: 1
  has_node_feat: false
  is_save_split: false
  is_sample_subgraph: true
  is_overwrite_precompute: false

# -----------------------------------------------------------------------------
# 4. TEST / INFERENCE
# -----------------------------------------------------------------------------
test:
  batch_size: 1
  num_workers: 0
  num_test_gen: 9               # DB only has 41 graphs; 9 test samples is enough
  is_vis: true
  is_single_plot: false
  is_test_ER: false
  num_vis: 20
  vis_num_row: 3
  better_vis: true
  test_model_dir: snapshot_model
  test_model_name: gran_v2_DB.pth

# -----------------------------------------------------------------------------
# 5. RUNTIME
# -----------------------------------------------------------------------------
exp_name: GRANv2
exp_dir: exp/GRANv2
runner: GranRunnerV2
use_horovod: false
use_gpu: true
device: cuda:0
gpus: [0]
seed: 1234
