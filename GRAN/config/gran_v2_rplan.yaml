---
# =============================================================================
# GRAN v2 training config for RPLAN floorplan bubble diagrams
# (7 room types, 4-8 nodes per graph, ~70k graphs)
#
# Prerequisite: run the preprocessing pipeline to produce data/rplan/graphs.p:
#   uv run python dataset/rplan_preprocessing/preprocess.py \\
#       --raw_dir D:/Github/GSDiff/datasets/rplandata/Data/floorplan_dataset \\
#       --out_dir data/rplan
#
# Run training / testing:
#   uv run python run_exp.py -c config/gran_v2_rplan.yaml        # train
#   uv run python run_exp.py -c config/gran_v2_rplan.yaml -t     # test
# =============================================================================

# -----------------------------------------------------------------------------
# 1. MOST-COMMONLY TUNED TRAINING KNOBS
# -----------------------------------------------------------------------------
train:
  # RPLAN graphs are tiny (4-8 nodes), so each mini-batch has lots of graphs
  # and training per epoch is fast. Expect convergence in hundreds of epochs.
  max_epoch: 500                # small graphs converge fast; 500 is a safe default
  batch_size: 32                # much larger than grid/DB because graphs are small
  num_workers: 0                # Windows-friendly

  optimizer: Adam
  lr: 1.0e-4
  wd: 0.0
  momentum: 0.9
  lr_decay: 0.3
  lr_decay_epoch: [300, 400]    # decay lr at epoch 300 and 400 (before end)

  lambda_attr: 1.0              # attr loss weight — tune this if attr acc is poor

  display_iter: 50              # RPLAN trains fast, log less often
  snapshot_epoch: 50
  valid_epoch: 25
  shuffle: true
  is_resume: false
  resume_dir:
  resume_model: model_snapshot_0000500.pth
  resume_epoch: 500

# -----------------------------------------------------------------------------
# 2. MODEL ARCHITECTURE
# -----------------------------------------------------------------------------
model:
  name: GRANv2

  # Backbone switch
  use_gatv2: true               # try `false` to compare against GRU baseline
  gatv2_num_heads: 4

  # Node attributes: 7 classes matching the GSDiff room taxonomy
  #   0 Living, 1 Bedroom, 2 Bathroom, 3 Kitchen, 4 Balcony, 5 Storage, 6 External
  num_attr_classes: 7

  # Smaller than grid/DB because RPLAN graphs are tiny
  hidden_dim: 128
  embedding_dim: 128
  num_GNN_layers: 4             # fewer layers — info propagates across small graphs fast
  num_GNN_prop: 1

  # RPLAN has at most ~8 rooms. Padding to 16 gives headroom for unusual floorplans.
  max_num_nodes: 16
  num_mix_component: 20
  is_sym: true
  block_size: 1                 # 1 node at a time
  sample_stride: 1
  num_canonical_order: 1
  dimension_reduce: true
  has_attention: true
  edge_weight: 1.0

# -----------------------------------------------------------------------------
# 3. DATASET
# -----------------------------------------------------------------------------
dataset:
  loader_name: GRANDataV2       # v2 loader to include node_attrs
  name: RPLAN                   # must match a branch in utils/data_helper.create_graphs()
  data_path: data/rplan/        # where graphs.p lives
  node_order: DFS
  train_ratio: 0.9              # more training data since RPLAN has 70k graphs
  dev_ratio: 0.05
  num_subgraph_batch: 8         # RPLAN graphs have ~8 nodes so 8 subgraphs is reasonable
  num_fwd_pass: 1
  has_node_feat: false
  is_save_split: false
  is_sample_subgraph: true
  is_overwrite_precompute: false

# -----------------------------------------------------------------------------
# 4. TEST / INFERENCE
# -----------------------------------------------------------------------------
test:
  batch_size: 100               # RPLAN test samples are small; batch heavily
  num_workers: 0
  num_test_gen: 1000            # we have plenty of RPLAN test data
  is_vis: true
  is_single_plot: false
  is_test_ER: false
  num_vis: 20
  vis_num_row: 5
  better_vis: true
  test_model_dir: snapshot_model
  test_model_name: gran_v2_rplan.pth

# -----------------------------------------------------------------------------
# 5. RUNTIME
# -----------------------------------------------------------------------------
exp_name: GRANv2_rplan
exp_dir: exp/GRANv2_rplan
runner: GranRunnerV2
use_horovod: false
use_gpu: true
device: cuda:0
gpus: [0]
seed: 1234
