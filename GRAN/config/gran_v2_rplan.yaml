---
# =============================================================================
# GRAN v2 training config for RPLAN floorplan bubble diagrams (40k graphs).
#
# Tuned for:
#   - 40,000 preprocessed RPLAN graphs (4-8 nodes each, 7 attr classes)
#   - RTX 3090 (24 GB VRAM)
#   - joint edge + attr training with validation tracking
#
# Train / test:
#   uv run python run_exp.py -c config/gran_v2_rplan.yaml          # train
#   uv run python run_exp.py -c config/gran_v2_rplan.yaml -t       # test
# =============================================================================

# -----------------------------------------------------------------------------
# 1. MOST-COMMONLY TUNED TRAINING KNOBS
# -----------------------------------------------------------------------------
train:
  max_epoch: 300                # with 40k graphs, ~300 epochs is enough
  batch_size: 64                # bigger batch: smoother loss, better GPU utilization
  num_workers: 0                # Windows-friendly

  optimizer: Adam
  lr: 2.0e-4                    # slightly higher to match larger batch size
  wd: 1.0e-5                    # small weight decay to help generalization
  momentum: 0.9
  lr_decay: 0.3
  lr_decay_epoch: [5, 15]    # earlier decays -- plateau kicked in around epoch 10 at lr=1e-4

  lambda_attr: 0.5              # attr learns fast -- down-weight so edge head dominates later

  display_iter: 50              # RPLAN trains fast, log less often
  snapshot_epoch: 25            # save every 25 epochs (12 checkpoints total)
  valid_epoch: 5                # compute val loss every 5 epochs to see overfit early
  shuffle: true
  is_resume: false
  resume_dir:
  resume_model: model_snapshot_0000300.pth
  resume_epoch: 300

# -----------------------------------------------------------------------------
# 2. MODEL ARCHITECTURE — bumped capacity to exploit 40k data
# -----------------------------------------------------------------------------
model:
  name: GRANv2

  # Backbone switch
  use_gatv2: true               # try `false` to compare against GRU baseline
  gatv2_num_heads: 8            # more heads -- captures multiple local patterns

  # Node attributes: 7 classes matching the GSDiff room taxonomy
  #   0 Living, 1 Bedroom, 2 Bathroom, 3 Kitchen, 4 Balcony, 5 Storage, 6 External
  num_attr_classes: 7

  # Doubled capacity: 40k data can support a bigger model without overfitting
  hidden_dim: 256               # was 128
  embedding_dim: 256            # was 128
  num_GNN_layers: 6             # was 4 -- deeper message passing
  num_GNN_prop: 1

  max_num_nodes: 16
  num_mix_component: 30         # was 20 -- more mixture modes = richer edge dist
  is_sym: true
  block_size: 1                 # 1 node at a time
  sample_stride: 1
  num_canonical_order: 1
  dimension_reduce: true
  has_attention: true
  edge_weight: 1.0

# -----------------------------------------------------------------------------
# 3. DATASET
# -----------------------------------------------------------------------------
dataset:
  loader_name: GRANDataV2       # v2 loader to include node_attrs
  name: RPLAN                   # must match a branch in utils/data_helper.create_graphs()
  data_path: data/              # create_graphs('RPLAN') reads <data_path>/rplan/graphs.p
  node_order: DFS

  # Cap the number of graphs actually used (0 or unset = use all available).
  # Useful for quick experiments without re-running preprocessor.
  # train_ratio / dev_ratio apply within this capped subset.
  #   e.g. total_graphs=10000 + train_ratio=0.9 + dev_ratio=0.05
  #        -> 9000 train, 500 dev, 500 test
  total_graphs: 20000

  train_ratio: 0.9              # within `total_graphs` (or all if unset)
  dev_ratio: 0.05
                                # remaining 1 - train - dev = test fraction
  num_subgraph_batch: 8
  num_fwd_pass: 1
  has_node_feat: false
  is_save_split: false
  is_sample_subgraph: true
  is_overwrite_precompute: true   # set true after dataset size changes; false to reuse cache

# -----------------------------------------------------------------------------
# 4. TEST / INFERENCE
# -----------------------------------------------------------------------------
test:
  batch_size: 100
  num_workers: 0
  num_test_gen: 1000
  is_vis: true
  is_single_plot: false
  is_test_ER: false
  num_vis: 20
  vis_num_row: 5
  better_vis: true
  test_model_dir: exp/GRANv2_rplan/GRANv2_RPLAN_2026-Apr-20-15-43-48_24504
  test_model_name: model_best.pth

# -----------------------------------------------------------------------------
# 5. RUNTIME
# -----------------------------------------------------------------------------
exp_name: GRANv2_rplan
exp_dir: exp/GRANv2_rplan
runner: GranRunnerV2
use_horovod: false
use_gpu: true
device: cuda:0
gpus: [0]
seed: 1234
