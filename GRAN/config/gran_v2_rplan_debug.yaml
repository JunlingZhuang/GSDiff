---
# =============================================================================
# GRAN v2 DEBUG config — small-epoch smoke test on RPLAN.
#
# Run after preprocessing (data/rplan/graphs.p must exist):
#   D:/Github/GSDiff/.venv/Scripts/python.exe run_exp.py -c config/gran_v2_rplan_debug.yaml
# =============================================================================

train:
  max_epoch: 5                  # just 5 epochs — validate the pipeline
  batch_size: 16
  num_workers: 0
  optimizer: Adam
  lr: 1.0e-4
  wd: 0.0
  momentum: 0.9
  lr_decay: 0.3
  lr_decay_epoch: [100000000]
  lambda_attr: 1.0
  display_iter: 1
  snapshot_epoch: 2
  valid_epoch: 2
  shuffle: true
  is_resume: false
  resume_dir:
  resume_model: model_snapshot_0000005.pth
  resume_epoch: 5

model:
  name: GRANv2
  use_gatv2: true
  gatv2_num_heads: 2
  num_attr_classes: 7           # 7 room types
  hidden_dim: 64                # small for debug
  embedding_dim: 64
  num_GNN_layers: 3
  num_GNN_prop: 1
  max_num_nodes: 16
  num_mix_component: 10
  is_sym: true
  block_size: 1
  sample_stride: 1
  num_canonical_order: 1
  dimension_reduce: true
  has_attention: true
  edge_weight: 1.0

dataset:
  loader_name: GRANDataV2
  name: RPLAN
  data_path: data/              # reads data/rplan/graphs.p
  node_order: DFS
  train_ratio: 0.9
  dev_ratio: 0.05
  num_subgraph_batch: 8
  num_fwd_pass: 1
  has_node_feat: false
  is_save_split: false
  is_sample_subgraph: true
  is_overwrite_precompute: true

test:
  batch_size: 10
  num_workers: 0
  num_test_gen: 10
  is_vis: true
  is_single_plot: false
  is_test_ER: false
  num_vis: 10
  vis_num_row: 5
  better_vis: true
  test_model_dir: snapshot_model
  test_model_name: gran_v2_rplan.pth

exp_name: GRANv2_rplan_debug
exp_dir: exp/GRANv2_rplan_debug
runner: GranRunnerV2
use_horovod: false
use_gpu: true
device: cuda:0
gpus: [0]
seed: 1234
